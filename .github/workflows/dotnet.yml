name: Build Selected .NET Projects

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    # 방법 1: 특정 프로젝트 파일들을 직접 지정하여 빌드
    - name: Build .NET 8.0 Projects (Method 1 - Specific Projects)
      run: |
        dotnet build CommonNetwork/MyCommonNet.csproj --configuration Release
        
        dotnet build MyAspire.ServiceDefaults/MyAspire.ServiceDefaults.csproj --configuration Release
        dotnet build MyAspire.AppHost/MyAspire.AppHost.csproj --configuration Release
        dotnet build MyAspire.Web/MyAspire.Web.csproj --configuration Release

        dotnet build TcpServerStandard/TcpServerStandard.csproj --configuration Release
        dotnet build TcpClientStandard/TestTcpClient.csproj --configuration Release
        
        dotnet build NetStandardUnitTest/NetStandardUnitTest.csproj --configuration Release
        
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release