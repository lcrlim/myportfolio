name: Build All .NET Projects (No Solution File)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore All Projects
      run: |
        Get-ChildItem -Recurse -Filter "*.csproj" | ForEach-Object {
          Write-Host "Restoring: $($_.Name)"
          dotnet restore $_.FullName
        }
      shell: pwsh
    
    - name: Build All Projects
      run: |
        Get-ChildItem -Recurse -Filter "*.csproj" | ForEach-Object {
          Write-Host "Building: $($_.Name)"
          dotnet build $_.FullName --configuration Release --no-restore
        }
      shell: pwsh
    
    - name: Test All Projects
      run: |
        Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { 
          $_.Name -like "*Test*" -or $_.Name -like "*test*" 
        } | ForEach-Object {
          Write-Host "Testing: $($_.Name)"
          dotnet test $_.FullName --configuration Release --no-build --verbosity normal
        }
      shell: pwsh